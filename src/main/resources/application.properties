# Application
spring.application.name=team-task-manager
server.port=${PORT:8080}

# Database Configuration (H2 for dev, MySQL for production via Railway)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:taskmanagerdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# H2 Console (dev only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.teamtask=INFO
logging.level.org.springframework.security=WARN
