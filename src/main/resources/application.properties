# Application
spring.application.name=team-task-manager
server.port=${PORT:8080}

# Database Configuration (H2 for dev, MySQL for production via Railway)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:taskmanagerdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# H2 Console (dev only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Logging Configuration =====
# Root logger
logging.level.root=INFO

# Application-level logging (all com.teamtask classes)
logging.level.com.teamtask=DEBUG

# Specific layer logging
logging.level.com.teamtask.controller=INFO
logging.level.com.teamtask.service=INFO
logging.level.com.teamtask.security=INFO
logging.level.com.teamtask.exception=INFO
logging.level.com.teamtask.repository=DEBUG

# Spring Security logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Spring Web / MVC logging
logging.level.org.springframework.web=INFO

# Hibernate SQL logging (set to DEBUG to see actual SQL queries)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Log pattern with thread name for better traceability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
