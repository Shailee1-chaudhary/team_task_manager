<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Team Task Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📋 Task Manager</h2>
                <div class="user-info">
                    <div class="user-name"></div>
                    <div><span class="user-role-badge"></span></div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html"><span class="icon">📊</span> Dashboard</a>
                <a href="/projects.html"><span class="icon">📁</span> Projects</a>
                <a href="/tasks.html"><span class="icon">✅</span> My Tasks</a>
                <a href="/board.html"><span class="icon">📋</span> Board</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logout(); return false;">🚪 Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1 id="pageTitle">✅ My Tasks</h1>
                <div style="display:flex;gap:12px;align-items:center;">
                    <select id="filterStatus" onchange="filterTasks()" style="padding:8px 12px;border:2px solid #e1e5eb;border-radius:8px;">
                        <option value="">All Status</option>
                        <option value="TODO">To Do</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="BLOCKED">Blocked</option>
                        <option value="CODE_REVIEW">Code Review</option>
                        <option value="QA_TESTING">QA Testing</option>
                        <option value="QA_TESTING_FAILED">QA Testing Failed</option>
                        <option value="DONE">Done</option>
                    </select>
                    <button class="btn btn-primary" onclick="openCreateTaskModal()">+ New Task</button>
                </div>
            </div>

            <div id="alert" class="alert alert-error"></div>

            <div id="tasksContainer">
                <div class="loading"><div class="spinner"></div><p>Loading tasks...</p></div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h2 id="taskModalTitle">Create Task</h2>
            <div id="taskModalAlert" class="alert alert-error"></div>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" placeholder="Task title" required minlength="2" maxlength="300">
                </div>
                <div class="form-group">
                    <label for="taskDesc">Description <span id="descCharCount" style="font-weight:400;color:#888;font-size:12px;"></span></label>
                    <textarea id="taskDesc" placeholder="Task description" maxlength="2000"></textarea>
                </div>
                <div class="form-group">
                    <label for="taskProject">Project</label>
                    <select id="taskProject" required>
                        <option value="">Select project...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskAssignee">Assignee</label>
                    <select id="taskAssignee">
                        <option value="">Unassigned</option>
                    </select>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus">
                            <option value="TODO">To Do</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="BLOCKED">Blocked</option>
                            <option value="CODE_REVIEW">Code Review</option>
                            <option value="QA_TESTING">QA Testing</option>
                            <option value="QA_TESTING_FAILED">QA Testing Failed</option>
                            <option value="DONE">Done</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                        </select>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group">
                        <label for="taskStoryPoints">Story Points</label>
                        <select id="taskStoryPoints">
                            <option value="">None</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="5">5</option>
                            <option value="8">8</option>
                            <option value="13">13</option>
                            <option value="21">21</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="taskSaveBtn" style="width:auto;">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div class="modal-overlay" id="taskDetailModal">
        <div class="modal-large">
            <div class="task-detail-header">
                <button class="close-btn" onclick="closeTaskDetailModal()">&times;</button>
                <h2 id="detailTitle"></h2>
                <div class="task-detail-badges" id="detailBadges"></div>
            </div>
            <div class="task-detail-body">
                <div class="task-detail-grid">
                    <div class="task-detail-field">
                        <label>Project</label>
                        <div class="value" id="detailProject"></div>
                    </div>
                    <div class="task-detail-field">
                        <label>Assignee</label>
                        <div class="value" id="detailAssignee"></div>
                    </div>
                    <div class="task-detail-field">
                        <label>Created By</label>
                        <div class="value" id="detailCreatedBy"></div>
                    </div>
                    <div class="task-detail-field">
                        <label>Due Date</label>
                        <div class="value" id="detailDueDate"></div>
                    </div>
                    <div class="task-detail-field">
                        <label>Story Points</label>
                        <div class="value" id="detailStoryPoints"></div>
                    </div>
                    <div class="task-detail-field">
                        <label>Created</label>
                        <div class="value" id="detailCreatedAt"></div>
                    </div>
                </div>

                <div id="detailDescriptionSection">
                    <label style="display:block;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Description</label>
                    <div class="task-detail-description" id="detailDescription"></div>
                </div>

                <!-- Progress Notes Section -->
                <div class="progress-section">
                    <h3>📝 Progress Notes <span class="count" id="progressCount">0</span></h3>
                    <div class="progress-input-area">
                        <textarea id="progressInput" placeholder="Add a progress update..." rows="2"></textarea>
                        <button onclick="handleAddProgress()">Add</button>
                    </div>
                    <div class="progress-list" id="progressList">
                        <div class="progress-empty">No progress notes yet. Add one above!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (!requireAuth()) { /* redirects */ }
        initSidebar();

        let currentProjectId = null;
        let allTasks = [];
        let projectsList = [];
        let usersList = [];
        let currentDetailTaskId = null;

        // Check if viewing project-specific tasks
        const params = new URLSearchParams(window.location.search);
        currentProjectId = params.get('projectId');

        if (currentProjectId) {
            document.getElementById('pageTitle').textContent = '📝 Project Tasks';
        }

        loadData();

        async function loadData() {
            try {
                // Load projects for dropdown
                const projResult = await getProjects();
                if (projResult && projResult.success) {
                    projectsList = projResult.data || [];
                }

                // Load users for assignee dropdown
                const usersResult = await getAllUsers();
                if (usersResult && usersResult.success) {
                    usersList = usersResult.data || [];
                }

                // Load tasks
                await loadTasks();
            } catch (err) {
                console.error(err);
            }
        }

        async function loadTasks() {
            try {
                let result;
                if (currentProjectId) {
                    result = await getTasksByProject(currentProjectId);
                    // Update page title with project name
                    const proj = projectsList.find(p => p.id == currentProjectId);
                    if (proj) document.getElementById('pageTitle').textContent = '📝 ' + proj.name + ' - Tasks';
                } else {
                    result = await getMyTasks();
                }

                if (result && result.success) {
                    allTasks = result.data || [];
                    filterTasks();
                }
            } catch (err) {
                showAlert('alert', 'Failed to load tasks');
            }
        }

        function filterTasks() {
            const status = document.getElementById('filterStatus').value;
            let filtered = allTasks;
            if (status) {
                filtered = allTasks.filter(t => t.status === status);
            }
            renderTasks(filtered);
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">✅</div><h3>No tasks found</h3><p>Click "New Task" to create a task.</p></div>';
                return;
            }
            const user = getUser();
            container.innerHTML = tasks.map(t => {
                return `
                <div class="task-item ${t.overdue ? 'overdue' : ''}" onclick="openTaskDetail(${t.id})">
                    <div class="task-info">
                        <h4><span class="task-number">${escHtml(t.taskNumber)}</span> ${escHtml(t.title)}</h4>
                        ${t.description ? '<p style="font-size:13px;color:#666;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:600px;">' + escHtml(t.description) + '</p>' : ''}
                        <div class="task-meta">
                            <span>📁 ${escHtml(t.projectName)}</span>
                            <span>${statusBadge(t.status)}</span>
                            <span>${priorityBadge(t.priority)}</span>
                            ${t.storyPoints ? '<span>' + storyPointsBadge(t.storyPoints) + '</span>' : ''}
                            ${t.dueDate ? '<span>📅 ' + formatDate(t.dueDate) + '</span>' : ''}
                            ${t.overdue ? '<span class="badge badge-overdue">OVERDUE</span>' : ''}
                            ${t.assignee ? '<span>👤 ' + escHtml(t.assignee.name) + '</span>' : '<span>👤 Unassigned</span>'}
                            ${t.createdBy ? '<span>✍️ ' + escHtml(t.createdBy.name) + '</span>' : ''}
                            ${t.progressCount > 0 ? '<span class="progress-indicator">💬 ' + t.progressCount + '</span>' : ''}
                        </div>
                    </div>
                    <div class="task-actions" onclick="event.stopPropagation()">
                        <select onchange="handleStatusChange(${t.id}, this.value)" style="padding:6px;border-radius:6px;border:1px solid #ddd;font-size:12px;">
                            <option value="TODO" ${t.status === 'TODO' ? 'selected' : ''}>To Do</option>
                            <option value="IN_PROGRESS" ${t.status === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
                            <option value="BLOCKED" ${t.status === 'BLOCKED' ? 'selected' : ''}>Blocked</option>
                            <option value="CODE_REVIEW" ${t.status === 'CODE_REVIEW' ? 'selected' : ''}>Code Review</option>
                            <option value="QA_TESTING" ${t.status === 'QA_TESTING' ? 'selected' : ''}>QA Testing</option>
                            <option value="QA_TESTING_FAILED" ${t.status === 'QA_TESTING_FAILED' ? 'selected' : ''}>QA Failed</option>
                            <option value="DONE" ${t.status === 'DONE' ? 'selected' : ''}>Done</option>
                        </select>
                        <button class="btn btn-sm btn-warning" onclick="openEditTaskModal(${t.id})">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="handleDeleteTask(${t.id})">🗑️</button>
                    </div>
                </div>`;
            }).join('');
        }

        // ===== Task Detail Modal =====
        async function openTaskDetail(taskId) {
            currentDetailTaskId = taskId;
            try {
                const result = await getTask(taskId);
                if (result && result.success) {
                    const t = result.data;

                    document.getElementById('detailTitle').textContent = t.taskNumber + ' — ' + t.title;

                    // Badges
                    document.getElementById('detailBadges').innerHTML = `
                        ${statusBadge(t.status)}
                        ${priorityBadge(t.priority)}
                        ${t.storyPoints ? storyPointsBadge(t.storyPoints) : ''}
                        ${t.overdue ? '<span class="badge badge-overdue">OVERDUE</span>' : ''}
                    `;

                    // Fields
                    document.getElementById('detailProject').textContent = t.projectName;
                    document.getElementById('detailAssignee').textContent = t.assignee ? t.assignee.name : 'Unassigned';
                    document.getElementById('detailCreatedBy').textContent = t.createdBy ? t.createdBy.name : '—';
                    document.getElementById('detailDueDate').textContent = t.dueDate ? formatDate(t.dueDate) : 'No due date';
                    document.getElementById('detailStoryPoints').textContent = t.storyPoints ? t.storyPoints + ' SP' : 'Not estimated';
                    document.getElementById('detailCreatedAt').textContent = formatDateTime(t.createdAt);

                    // Description
                    const descEl = document.getElementById('detailDescription');
                    if (t.description) {
                        descEl.textContent = t.description;
                        descEl.classList.remove('empty');
                    } else {
                        descEl.textContent = 'No description provided.';
                        descEl.classList.add('empty');
                    }

                    // Render progress notes
                    renderProgressNotes(t.progressNotes || []);

                    document.getElementById('taskDetailModal').classList.add('active');
                }
            } catch (err) {
                const msg = err.data?.message || 'Failed to load task details';
                showAlert('alert', msg);
            }
        }

        function closeTaskDetailModal() {
            document.getElementById('taskDetailModal').classList.remove('active');
            currentDetailTaskId = null;
            document.getElementById('progressInput').value = '';
        }

        function renderProgressNotes(notes) {
            const list = document.getElementById('progressList');
            const countEl = document.getElementById('progressCount');
            countEl.textContent = notes.length;

            if (notes.length === 0) {
                list.innerHTML = '<div class="progress-empty">No progress notes yet. Add one above!</div>';
                return;
            }

            const currentUser = getUser();
            list.innerHTML = notes.map(n => `
                <div class="progress-item">
                    <div class="progress-meta">
                        <span><span class="author">${escHtml(n.author.name)}</span> &middot; ${formatDateTime(n.createdAt)}</span>
                    </div>
                    <div class="progress-content">${escHtml(n.content)}</div>
                    ${(currentUser && (n.author.id === currentUser.id || currentUser.role === 'ADMIN'))
                        ? '<button class="delete-progress" onclick="handleDeleteProgress(' + n.id + ')" title="Delete">🗑️</button>'
                        : ''}
                </div>
            `).join('');
        }

        async function handleAddProgress() {
            const input = document.getElementById('progressInput');
            const content = input.value.trim();
            if (!content) return;
            if (!currentDetailTaskId) return;

            try {
                await addTaskProgress(currentDetailTaskId, content);
                input.value = '';
                // Reload the task detail to get updated progress
                const result = await getTask(currentDetailTaskId);
                if (result && result.success) {
                    renderProgressNotes(result.data.progressNotes || []);
                }
                // Refresh task list to update progress count
                await loadTasks();
            } catch (err) {
                showAlert('alert', err.data?.message || 'Failed to add progress note');
            }
        }

        async function handleDeleteProgress(progressId) {
            if (!confirm('Delete this progress note?')) return;
            if (!currentDetailTaskId) return;

            try {
                await deleteTaskProgress(currentDetailTaskId, progressId);
                // Reload task detail
                const result = await getTask(currentDetailTaskId);
                if (result && result.success) {
                    renderProgressNotes(result.data.progressNotes || []);
                }
                await loadTasks();
            } catch (err) {
                showAlert('alert', err.data?.message || 'Failed to delete progress note');
            }
        }

        // Allow pressing Enter (without Shift) to submit progress
        document.getElementById('progressInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleAddProgress();
            }
        });

        // ===== Status Change =====
        async function handleStatusChange(taskId, newStatus) {
            try {
                await updateTaskStatus(taskId, newStatus);
                await loadTasks();
            } catch (err) {
                showAlert('alert', err.data?.message || 'Failed to update status');
                await loadTasks(); // reload to reset select
            }
        }

        // ===== Create/Edit Task Modal =====
        function openCreateTaskModal() {
            document.getElementById('taskModalTitle').textContent = 'Create Task';
            document.getElementById('taskSaveBtn').textContent = 'Create';
            document.getElementById('taskId').value = '';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskStatus').value = 'TODO';
            document.getElementById('taskPriority').value = 'MEDIUM';
            document.getElementById('taskStoryPoints').value = '';
            document.getElementById('taskDueDate').value = '';

            populateProjectDropdown();
            populateAssigneeDropdown();

            if (currentProjectId) {
                document.getElementById('taskProject').value = currentProjectId;
            }

            document.getElementById('taskModal').classList.add('active');
        }

        async function openEditTaskModal(taskId) {
            try {
                const result = await getTask(taskId);
                if (result && result.success) {
                    const t = result.data;
                    document.getElementById('taskModalTitle').textContent = 'Edit Task';
                    document.getElementById('taskSaveBtn').textContent = 'Update';
                    document.getElementById('taskId').value = t.id;
                    document.getElementById('taskTitle').value = t.title;
                    document.getElementById('taskDesc').value = t.description || '';
                    document.getElementById('taskStatus').value = t.status;
                    document.getElementById('taskPriority').value = t.priority;
                    document.getElementById('taskStoryPoints').value = t.storyPoints || '';
                    document.getElementById('taskDueDate').value = t.dueDate || '';

                    populateProjectDropdown();
                    populateAssigneeDropdown();

                    document.getElementById('taskProject').value = t.projectId;
                    if (t.assignee) document.getElementById('taskAssignee').value = t.assignee.id;

                    document.getElementById('taskModal').classList.add('active');
                }
            } catch (err) {
                showAlert('alert', 'Failed to load task');
            }
        }

        function populateProjectDropdown() {
            const select = document.getElementById('taskProject');
            select.innerHTML = '<option value="">Select project...</option>' +
                projectsList.map(p => `<option value="${p.id}">${escHtml(p.name)}</option>`).join('');
        }

        function populateAssigneeDropdown() {
            const select = document.getElementById('taskAssignee');
            select.innerHTML = '<option value="">Unassigned</option>' +
                usersList.map(u => `<option value="${u.id}">${escHtml(u.name)} (${u.email})</option>`).join('');
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.remove('active');
            updateDescCharCount();
        }

        // Description character counter
        document.getElementById('taskDesc').addEventListener('input', updateDescCharCount);
        function updateDescCharCount() {
            const desc = document.getElementById('taskDesc');
            const count = document.getElementById('descCharCount');
            const len = desc.value.length;
            count.textContent = '(' + len + '/2000)';
            count.style.color = len > 1800 ? '#c00' : '#888';
        }

        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const taskId = document.getElementById('taskId').value;
            const spVal = document.getElementById('taskStoryPoints').value;
            const data = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                projectId: parseInt(document.getElementById('taskProject').value),
                status: document.getElementById('taskStatus').value,
                priority: document.getElementById('taskPriority').value,
                storyPoints: spVal ? parseInt(spVal) : null,
                dueDate: document.getElementById('taskDueDate').value || null,
                assigneeId: document.getElementById('taskAssignee').value ? parseInt(document.getElementById('taskAssignee').value) : null
            };

            try {
                if (taskId) {
                    await updateTask(taskId, data);
                } else {
                    await createTask(data);
                }
                closeTaskModal();
                await loadTasks();
            } catch (err) {
                showAlert('taskModalAlert', err.data?.message || 'Failed to save task');
            }
        });

        async function handleDeleteTask(taskId) {
            if (!confirm('Delete this task?')) return;
            try {
                await deleteTask(taskId);
                await loadTasks();
            } catch (err) {
                showAlert('alert', err.data?.message || 'Failed to delete task');
            }
        }

        // Close detail modal on overlay click
        document.getElementById('taskDetailModal').addEventListener('click', function(e) {
            if (e.target === this) closeTaskDetailModal();
        });

        // Close edit modal on overlay click
        document.getElementById('taskModal').addEventListener('click', function(e) {
            if (e.target === this) closeTaskModal();
        });

        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
