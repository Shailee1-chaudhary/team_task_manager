<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Team Task Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📋 Task Manager</h2>
                <div class="user-info">
                    <div class="user-name"></div>
                    <div><span class="user-role-badge"></span></div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html"><span class="icon">📊</span> Dashboard</a>
                <a href="/projects.html"><span class="icon">📁</span> Projects</a>
                <a href="/tasks.html"><span class="icon">✅</span> My Tasks</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logout(); return false;">🚪 Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>📊 Dashboard</h1>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-icon">📁</div>
                    <div class="stat-info">
                        <h3 id="totalProjects">0</h3>
                        <p>Projects</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📝</div>
                    <div class="stat-info">
                        <h3 id="totalTasks">0</h3>
                        <p>Total Tasks</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔵</div>
                    <div class="stat-info">
                        <h3 id="todoTasks">0</h3>
                        <p>To Do</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🟡</div>
                    <div class="stat-info">
                        <h3 id="inProgressTasks">0</h3>
                        <p>In Progress</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🟢</div>
                    <div class="stat-info">
                        <h3 id="completedTasks">0</h3>
                        <p>Completed</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔴</div>
                    <div class="stat-info">
                        <h3 id="overdueTasks">0</h3>
                        <p>Overdue</p>
                    </div>
                </div>
            </div>

            <!-- Overdue Tasks -->
            <div class="card" id="overdueSection" style="display:none;">
                <div class="card-header">
                    <h2>🔴 Overdue Tasks</h2>
                </div>
                <div id="overdueList"></div>
            </div>

            <!-- Recent Tasks -->
            <div class="card">
                <div class="card-header">
                    <h2>📋 Recent Tasks</h2>
                </div>
                <div id="recentTasks">
                    <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
                </div>
            </div>

            <!-- Projects Overview -->
            <div class="card">
                <div class="card-header">
                    <h2>📁 Your Projects</h2>
                    <a href="/projects.html" class="btn btn-sm btn-primary">View All</a>
                </div>
                <div id="projectsList">
                    <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (!requireAuth()) { /* redirects */ }

        initSidebar();
        loadDashboard();

        async function loadDashboard() {
            try {
                const result = await getDashboard();
                if (result && result.success) {
                    const d = result.data;
                    document.getElementById('totalProjects').textContent = d.totalProjects;
                    document.getElementById('totalTasks').textContent = d.totalTasks;
                    document.getElementById('todoTasks').textContent = d.todoTasks;
                    document.getElementById('inProgressTasks').textContent = d.inProgressTasks;
                    document.getElementById('completedTasks').textContent = d.completedTasks;
                    document.getElementById('overdueTasks').textContent = d.overdueTasks;

                    renderOverdueTasks(d.overDueTaskList || []);
                    renderRecentTasks(d.recentTasks || []);
                    renderProjects(d.projects || []);
                }
            } catch (err) {
                console.error('Dashboard error:', err);
            }
        }

        function renderOverdueTasks(tasks) {
            const section = document.getElementById('overdueSection');
            const container = document.getElementById('overdueList');
            if (tasks.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            container.innerHTML = tasks.map(t => taskItemHTML(t)).join('');
        }

        function renderRecentTasks(tasks) {
            const container = document.getElementById('recentTasks');
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📝</div><h3>No tasks yet</h3><p>Create a project and add tasks to get started.</p></div>';
                return;
            }
            container.innerHTML = tasks.map(t => taskItemHTML(t)).join('');
        }

        function renderProjects(projects) {
            const container = document.getElementById('projectsList');
            if (projects.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📁</div><h3>No projects yet</h3><p><a href="/projects.html">Create your first project</a></p></div>';
                return;
            }
            container.innerHTML = '<div class="projects-grid">' + projects.slice(0, 6).map(p => {
                const pct = p.totalTasks > 0 ? Math.round((p.completedTasks / p.totalTasks) * 100) : 0;
                return `
                <div class="project-card" onclick="window.location.href='/tasks.html?projectId=${p.id}'">
                    <h3>${escHtml(p.name)}</h3>
                    <p>${escHtml(p.description || 'No description')}</p>
                    <div class="project-meta">
                        <span>👥 ${p.members ? p.members.length : 0} members</span>
                        <span>📝 ${p.completedTasks}/${p.totalTasks} tasks</span>
                    </div>
                    <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
                </div>`;
            }).join('') + '</div>';
        }

        function taskItemHTML(t) {
            return `
            <div class="task-item ${t.overdue ? 'overdue' : ''}">
                <div class="task-info">
                    <h4>${escHtml(t.title)}</h4>
                    <div class="task-meta">
                        <span>📁 ${escHtml(t.projectName)}</span>
                        <span>${statusBadge(t.status)}</span>
                        <span>${priorityBadge(t.priority)}</span>
                        ${t.dueDate ? '<span>📅 ' + formatDate(t.dueDate) + '</span>' : ''}
                        ${t.overdue ? '<span class="badge badge-overdue">OVERDUE</span>' : ''}
                        ${t.assignee ? '<span>👤 ' + escHtml(t.assignee.name) + '</span>' : ''}
                    </div>
                </div>
            </div>`;
        }

        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
